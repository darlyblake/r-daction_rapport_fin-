name: Publier le rapport sur GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'Projet_fin_licence_UNG_version_HTML_corrige.html'
      - 'assets/embedded/**'
      - 'captures/**'
      - 'diagrammes/exports/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer le site statique
        run: |
          mkdir -p site/captures site/diagrammes site/assets/embedded
          cp Projet_fin_licence_UNG_version_HTML_corrige.html site/index.html
          cp -R captures/. site/captures/
          cp -R assets/embedded/. site/assets/embedded/
          cp -R diagrammes/exports site/diagrammes/exports
          touch site/.nojekyll

      - name: Vérifier la page d'accueil et les ressources
        run: |
          test -s site/index.html
          test -d site/captures
          test -d site/diagrammes/exports
          test -d site/assets/embedded
          echo "Rapport HTML et dossiers de ressources prêts pour publication."

      - name: Créer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
